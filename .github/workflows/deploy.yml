# Build & deploy Arovyx Studio to Vercel whenever code lands on master
# (a merged pull request is a push to master). Can also be run by hand from
# the Actions tab ("Run workflow") or with `gh workflow run deploy.yml`.
#
# GitHub Secrets / Variables are the single source of truth: every deploy
# syncs them into the Vercel project's runtime environment, applies the
# Prisma schema to Neon, seeds an empty database, then builds and deploys.
name: Deploy to Vercel

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two production deploys at once; a newer push waits for the
# running one instead of cancelling it mid-deploy.
concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24" # matches the Vercel project setting
  VERCEL_CLI_VERSION: "65.2.0"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  check:
    name: Typecheck & validate
    runs-on: ubuntu-latest
    env:
      # prisma validate / generate need the variables to exist; no connection is made.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx prisma validate
      - run: npm test

  deploy:
    name: Deploy production
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Check required secrets
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID DATABASE_URL DIRECT_URL \
                      NVIDIA_NIM_API_KEY ADMIN_SECRET_KEY ADMIN_JWT_SECRET NEXT_PUBLIC_SITE_URL; do
            if [ -z "${!name}" ]; then echo "::error::Missing secret/variable: $name"; missing=1; fi
          done
          exit $missing

      - run: npm ci
      - run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      # Studio → Quiz Master: catch a mis-pasted Firebase key here rather
      # than at the first run. Never prints the key. Missing = warning only
      # (the tab then does dry runs); present but broken = fail the deploy.
      - name: Check Quiz Master Firebase key
        env:
          QUIZMASTER_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.QUIZMASTER_FIREBASE_SERVICE_ACCOUNT }}
          QUIZMASTER_FIREBASE_PROJECT_ID: ${{ vars.QUIZMASTER_FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$QUIZMASTER_FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::QUIZMASTER_FIREBASE_SERVICE_ACCOUNT is not set: Studio → Quiz Master can only do dry runs"
            exit 0
          fi
          project=$(printf '%s' "$QUIZMASTER_FIREBASE_SERVICE_ACCOUNT" | jq -er 'select(.type == "service_account" and (.private_key | length) > 0 and (.client_email | length) > 0) | .project_id') \
            || { echo "::error::QUIZMASTER_FIREBASE_SERVICE_ACCOUNT is not a valid service-account key JSON (paste it on one line: jq -c . key.json | gh secret set QUIZMASTER_FIREBASE_SERVICE_ACCOUNT)"; exit 1; }
          want="${QUIZMASTER_FIREBASE_PROJECT_ID:-$project}"
          if [ "$project" != "$want" ]; then
            echo "::error::the Quiz Master key is for project $project, but QUIZMASTER_FIREBASE_PROJECT_ID is $want"; exit 1
          fi
          echo "Quiz Master Firebase key OK (project $project)"

      # Studio → Color Tap: the same check. The tab deletes users, so a key for
      # any other project fails the deploy. Missing = warning only.
      - name: Check Color Tap Firebase key
        env:
          COLORTAP_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.COLORTAP_FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$COLORTAP_FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::COLORTAP_FIREBASE_SERVICE_ACCOUNT is not set: Studio → Color Tap can't run"
            exit 0
          fi
          project=$(printf '%s' "$COLORTAP_FIREBASE_SERVICE_ACCOUNT" | jq -er 'select(.type == "service_account" and (.private_key | length) > 0 and (.client_email | length) > 0) | .project_id') \
            || { echo "::error::COLORTAP_FIREBASE_SERVICE_ACCOUNT is not a valid service-account key JSON (paste it on one line: jq -c . key.json | gh secret set COLORTAP_FIREBASE_SERVICE_ACCOUNT)"; exit 1; }
          if [ "$project" != "color-tap-c06bf" ]; then
            echo "::error::the Color Tap key is for project $project, not color-tap-c06bf"; exit 1
          fi
          echo "Color Tap Firebase key OK (project $project)"

      # Uses the Vercel REST API (upsert) rather than `vercel env add`, whose
      # generic "Could not retrieve Project Settings" error hid the real cause
      # in CI. Any failure here prints the actual HTTP status + API message.
      # DATABASE_URL is not synced: the Neon ↔ Vercel integration manages it
      # at runtime (same database). The GitHub secret is used by the schema
      # push and seed steps below.
      - name: Sync GitHub Secrets → Vercel runtime environment
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          NVIDIA_NIM_MODEL: ${{ vars.NVIDIA_NIM_MODEL }}
          NVIDIA_NIM_BASE_URL: ${{ vars.NVIDIA_NIM_BASE_URL }}
          ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          # Studio → Quiz Master (optional: the tab only does dry runs without the key)
          QUIZMASTER_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.QUIZMASTER_FIREBASE_SERVICE_ACCOUNT }}
          QUIZMASTER_FIREBASE_PROJECT_ID: ${{ vars.QUIZMASTER_FIREBASE_PROJECT_ID }}
          QUIZMASTER_GEN_MODEL: ${{ vars.QUIZMASTER_GEN_MODEL }}
          QUIZMASTER_VERIFY_MODEL: ${{ vars.QUIZMASTER_VERIFY_MODEL }}
          QUIZMASTER_TRANSLATE_MODEL: ${{ vars.QUIZMASTER_TRANSLATE_MODEL }}
          # Studio → Color Tap (optional: the tab can't run without the key)
          COLORTAP_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.COLORTAP_FIREBASE_SERVICE_ACCOUNT }}
        run: |
          api="https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_ORG_ID"
          failed=0
          for name in DIRECT_URL NVIDIA_NIM_API_KEY NVIDIA_NIM_MODEL NVIDIA_NIM_BASE_URL \
                      ADMIN_SECRET_KEY ADMIN_JWT_SECRET NEXT_PUBLIC_SITE_URL \
                      QUIZMASTER_FIREBASE_SERVICE_ACCOUNT QUIZMASTER_FIREBASE_PROJECT_ID \
                      QUIZMASTER_GEN_MODEL QUIZMASTER_VERIFY_MODEL QUIZMASTER_TRANSLATE_MODEL \
                      COLORTAP_FIREBASE_SERVICE_ACCOUNT; do
            value="${!name}"
            [ -z "$value" ] && { echo "skip $name (not set; app default applies)"; continue; }
            # GitHub Secrets → "sensitive" (encrypted, never readable back; runtime-only).
            # GitHub Variables → "plain": the build must read them (NEXT_PUBLIC_* is
            # inlined at build time; a sensitive value would pull as "[SENSITIVE]").
            case "$name" in
              NEXT_PUBLIC_SITE_URL|NVIDIA_NIM_MODEL|NVIDIA_NIM_BASE_URL) type=plain ;;
              QUIZMASTER_FIREBASE_PROJECT_ID|QUIZMASTER_GEN_MODEL|QUIZMASTER_VERIFY_MODEL|QUIZMASTER_TRANSLATE_MODEL) type=plain ;;
              *) type=sensitive ;;
            esac
            body=$(jq -n --arg k "$name" --arg v "$value" --arg t "$type" \
              '{key: $k, value: $v, type: $t, target: ["production"]}')
            code=$(curl -sS -o resp.json -w '%{http_code}' -X POST "$api" \
              -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
              --data "$body")
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then
              echo "synced $name ($type)"
            else
              echo "::error::sync $name failed: HTTP $code $(jq -r '.error.code + ": " + .error.message' resp.json 2>/dev/null)"
              failed=1
            fi
          done
          rm -f resp.json
          exit $failed

      - name: Apply database schema (Neon)
        # Without --accept-data-loss, Prisma refuses destructive changes.
        run: npx prisma db push --skip-generate

      - name: Seed empty database
        run: npx tsx prisma/seed.ts --if-empty

      # pull again so the build sees the freshly synced values
      - name: Pull Vercel project settings + env
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        env:
          SITE: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          set -e
          for path in / /projects /api/projects /robots.txt /sitemap.xml /studio; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$SITE$path")
            echo "$path → $code"; [ "$code" = "200" ]
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/studio/overview")
          echo "/studio/overview (anonymous) → $code"; [ "$code" = "307" ]
          echo "✅ Live at $SITE" >> "$GITHUB_STEP_SUMMARY"
